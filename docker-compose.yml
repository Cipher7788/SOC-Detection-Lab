# Local SOC lab. Copy .env.example to .env before starting.
services:
  splunk:
    image: ${SPLUNK_IMAGE:-splunk/splunk:latest}
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD in .env}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN in .env}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:8089:8089"
      - "127.0.0.1:9997:9997"
      - "127.0.0.1:5514:514/udp"
    volumes:
      - splunk_etc:/opt/splunk/etc
      - splunk_var:/opt/splunk/var
      - ./splunk/apps/soc_lab:/opt/splunk/etc/apps/soc_lab:ro
      - ./splunk/lookups:/opt/splunk/etc/apps/soc_lab/lookups:ro
      - ./splunk/defaults.yml:/tmp/defaults/default.yml:ro
      - ./data-sources:/data-sources:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/services/collector/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  data-generator:
    build:
      context: .
      dockerfile: data-generator.dockerfile
    depends_on:
      splunk:
        condition: service_healthy
    environment:
      SPLUNK_HEC_URL: http://splunk:8088
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN in .env}
    restart: "no"

volumes:
  splunk_etc:
  splunk_var:
