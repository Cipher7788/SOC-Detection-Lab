version: '3.8'

# =============================================================================
# SOC Detection Lab – Docker Compose Stack
# =============================================================================
# Quick start:
#   1. Copy .env.example to .env and set SPLUNK_HEC_TOKEN
#   2. Run:  docker-compose up -d
#   3. Open: http://localhost:8000   (admin / SocLab@2026)
# =============================================================================

services:

  # ── Splunk Enterprise ───────────────────────────────────────────────────────
  splunk:
    image: splunk/splunk:latest
    container_name: splunk-soc-lab
    environment:
      SPLUNK_START_ARGS:  '--accept-license'
      SPLUNK_PASSWORD:    '${SPLUNK_PASSWORD:-SocLab@2026}'
      SPLUNK_LICENSE_URI: 'Free'
    ports:
      - "8000:8000"        # Web UI
      - "8088:8088"        # HTTP Event Collector (HEC)
      - "8089:8089"        # Splunk management port (REST API)
      - "9997:9997"        # Splunk TCP input
      - "514:514/udp"      # Syslog input
    volumes:
      - splunk_etc:/opt/splunk/etc
      - splunk_var:/opt/splunk/var
      - ./splunk/apps:/opt/splunk/etc/apps/soc_lab        # App config
      - ./splunk/lookups:/opt/splunk/etc/apps/soc_lab/lookups  # Lookup files
      - ./splunk/init:/tmp/init                            # Init scripts
      - ./data-sources:/data-sources                       # Sample data
    networks:
      - soc-lab-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/en-US/account/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ── Data Generator (optional) ───────────────────────────────────────────────
  data-generator:
    build:
      context:    .
      dockerfile: data-generator.dockerfile
    container_name: soc-data-generator
    depends_on:
      splunk:
        condition: service_healthy
    environment:
      SPLUNK_HEC_URL:   'http://splunk:8088'
      SPLUNK_HEC_TOKEN: '${SPLUNK_HEC_TOKEN:-changeme}'   # Set in .env
    volumes:
      - ./scripts:/scripts
      - ./data-sources:/data-sources
    networks:
      - soc-lab-network
    restart: on-failure

volumes:
  splunk_etc:
    driver: local
  splunk_var:
    driver: local

networks:
  soc-lab-network:
    driver: bridge
