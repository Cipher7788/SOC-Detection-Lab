# HEC is managed by the official Docker image, using SPLUNK_HEC_TOKEN.
# Do not define another token here.
[udp://514]
disabled = false
connection_host = dns
sourcetype = syslog
index = main

[splunktcp://9997]
disabled = false

# File ingestion is optional. Use --format jsonl for monitored files.
# The default container uses HEC only, avoiding duplicate file + HEC ingestion.
[monitor:///data-sources/logs/*.jsonl]
disabled = false
sourcetype = soc_lab_json
index = security

[monitor:///data-sources/windows/*.csv]
disabled = false
sourcetype = csv
index = security

[monitor:///data-sources/network/*.csv]
disabled = false
sourcetype = csv
index = network
