# =============================================================================
# inputs.conf – SOC Lab Splunk App
# Data input definitions for the SOC Detection Lab
# =============================================================================

# ─── HTTP Event Collector (HEC) ───────────────────────────────────────────────
[http]
disabled = false
port     = 8088
enableSSL = false

[http://soc_lab_hec]
disabled  = false
index     = security
sourcetype = json
token     = REPLACE_WITH_HEC_TOKEN

# ─── Syslog (UDP) ─────────────────────────────────────────────────────────────
[udp://514]
disabled         = false
connection_host  = dns
sourcetype       = syslog
index            = main

# ─── TCP Input ────────────────────────────────────────────────────────────────
[tcp://9997]
disabled         = false
connection_host  = ip
sourcetype       = log
index            = security

# ─── File Monitor – generated sample data ────────────────────────────────────
[monitor:///data-sources/logs/*.json]
disabled   = false
sourcetype = json
index      = security

[monitor:///data-sources/windows/*.csv]
disabled   = false
sourcetype = csv
index      = security

[monitor:///data-sources/network/*.csv]
disabled   = false
sourcetype = csv
index      = network
