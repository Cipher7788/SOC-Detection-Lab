# JSON Lines: one complete event per line. HEC supplies explicit epoch times.
[soc_lab_json]
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 20
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TRUNCATE = 10000
EVAL-severity = case(EventID=4625, "high", EventID=4672, "critical", EventID=4688, "medium", EventID=4663, "medium", EventID=4657, "high", EventID=4728, "high", 1=1, "low")

