# =============================================================================
# props.conf – SOC Lab Splunk App
# Field extraction, timestamp parsing, and source-type definitions
# =============================================================================

# ─── Windows Security Events ─────────────────────────────────────────────────
[windows_events]
TIMESTAMP_FIELDS  = timestamp
TIME_FORMAT       = %Y-%m-%dT%H:%M:%SZ
TRUNCATE          = 10000
SHOULD_LINEMERGE  = false

# Derive severity from EventID
EVAL-severity = case(
    EventID=4625, "high",
    EventID=4672, "critical",
    EventID=4688, "medium",
    EventID=4663, "medium",
    EventID=4657, "high",
    EventID=4728, "high",
    1=1, "low"
)

# Categorise by EventID range
EVAL-event_category = case(
    EventID >= 4600 AND EventID < 4700, "Account",
    EventID >= 4700 AND EventID < 4800, "Policy",
    EventID >= 4800 AND EventID < 4900, "Detailed",
    1=1, "Other"
)

EVAL-is_critical = if(severity="critical", 1, 0)
EVAL-days_old    = round((now() - _time) / 86400)

TRANSFORMS-routing = route_to_security_index

# ─── Linux Syslog ─────────────────────────────────────────────────────────────
[linux_syslog]
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT      = %b %d %H:%M:%S
TRUNCATE         = 10000
TRANSFORMS-enrichment = add_host_info

# ─── Network Traffic ──────────────────────────────────────────────────────────
[network_traffic]
TIMESTAMP_FIELDS  = timestamp
TIME_FORMAT       = %Y-%m-%dT%H:%M:%SZ
SHOULD_LINEMERGE  = false
LINE_BREAKER      = ([\r\n]+)

EVAL-is_suspicious = case(
    dest_port > 50000, 1,
    bytes_out > 100000000, 1,
    1=1, 0
)

# ─── JSON (HEC / generated data) ─────────────────────────────────────────────
[json]
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT      = %Y-%m-%dT%H:%M:%SZ
SHOULD_LINEMERGE = false
KV_MODE          = json
