# =============================================================================
# eventtypes.conf – SOC Lab Splunk App
# Event type categorisation for easier searching
# =============================================================================

[authentication_success]
search   = EventID=4624
priority = 1

[authentication_failure]
search   = EventID=4625 OR EventID=4771
priority = 1

[privilege_use]
search   = EventID=4672 OR EventID=4673 OR EventID=4674
priority = 1

[process_creation]
search   = EventID=4688
priority = 1

[file_access]
search   = EventID=4663
priority = 1

[registry_change]
search   = EventID=4657
priority = 1

[user_account_change]
search   = EventID=4720 OR EventID=4728 OR EventID=4732 OR EventID=4756
priority = 1

[brute_force_indicator]
search   = EventID=4625 src_ip=*
priority = 2

[lateral_movement_indicator]
search   = process_name IN ("psexec.exe","wmic.exe","winrs.exe")
priority = 2

[malware_indicator]
search   = process_name IN ("mimikatz.exe","meterpreter.exe","cobalt_strike.exe","pwdump.exe")
priority = 2
