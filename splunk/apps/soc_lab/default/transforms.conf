# =============================================================================
# transforms.conf – SOC Lab Splunk App
# Field transformations, enrichment lookups, and routing
# =============================================================================

# ─── Index Routing ───────────────────────────────────────────────────────────
[route_to_security_index]
REGEX    = .
DEST_KEY = _MetaData:Index
FORMAT   = security

# ─── Host Enrichment ─────────────────────────────────────────────────────────
# Host enrichment can be added here when an inventory lookup is available.

# ─── Lookups ─────────────────────────────────────────────────────────────────
[internal_ips]
filename   = internal_ips.csv
match_type = WILDCARD(ip)

[known_bad_domains]
filename   = known_bad_domains.csv
match_type = WILDCARD(domain)

[known_bad_ips]
filename   = known_bad_ips.csv
match_type = CIDR(ip)
