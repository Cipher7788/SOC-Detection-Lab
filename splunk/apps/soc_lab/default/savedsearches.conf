# =============================================================================
# savedsearches.conf – SOC Lab Splunk App
# Saved searches and scheduled alert definitions
# =============================================================================

# ─── Brute Force Detection ───────────────────────────────────────────────────
[Brute Force Detection]
search = index=security (EventID=4625 OR EventID=4771) \
  | stats count as failed_logins by src_ip, user, dest_ip \
  | where failed_logins >= 5 \
  | eval severity="high", rule_name="Brute Force Detected" \
  | sort -failed_logins
dispatch.earliest_time  = -10m@m
dispatch.latest_time    = now
cron_schedule           = */5 * * * *
alert_type              = always
alert.severity          = 3
alert.suppress          = 1
alert.suppress.period   = 10m
alert.suppress.fields   = src_ip
actions                 = email, webhook
action.email.to         = security@company.com
action.email.subject    = [SOC Alert] Brute Force Detected – $result.src_ip$
action.email.sendresults = 1
action.email.format     = html
action.webhook.url      = https://hooks.slack.com/services/REPLACE/YOUR/WEBHOOK
enableSched             = 1
disabled                = 0

# ─── Privilege Escalation Detection ─────────────────────────────────────────
[Privilege Escalation Detection]
search = index=security (EventID=4672 OR EventID=4673 OR EventID=4728 OR EventID=4732) \
  | table _time, user, Privilege, TargetUserName, TargetDomainName, host \
  | sort -_time
dispatch.earliest_time = -10m
dispatch.latest_time   = now
cron_schedule          = */5 * * * *
alert_type             = always
alert.severity         = 5
actions                = email, webhook
action.email.to        = security@company.com
action.email.subject   = [SOC CRITICAL] Privilege Escalation – $result.user$
action.webhook.url     = https://hooks.slack.com/services/REPLACE/YOUR/WEBHOOK
enableSched            = 1
disabled               = 0

# ─── Lateral Movement Detection ──────────────────────────────────────────────
[Lateral Movement Detection]
search = index=security EventID=4688 \
  process_name IN ("psexec.exe","wmic.exe","winrs.exe","powershell.exe","at.exe") \
  | table _time, host, user, process_name, cmdline \
  | sort -_time
dispatch.earliest_time = -15m
dispatch.latest_time   = now
cron_schedule          = */5 * * * *
alert_type             = always
alert.severity         = 3
actions                = email, webhook
action.email.to        = security@company.com
action.email.subject   = [SOC Alert] Lateral Movement – $result.host$
action.webhook.url     = https://hooks.slack.com/services/REPLACE/YOUR/WEBHOOK
enableSched            = 1
disabled               = 0

# ─── Data Exfiltration Detection ─────────────────────────────────────────────
[Data Exfiltration Detection]
search = index=network \
  dest_ip!=10.0.0.0/8 dest_ip!=192.168.0.0/16 dest_ip!=172.16.0.0/12 \
  | stats sum(bytes_out) as total_bytes by src_ip, dest_ip \
  | where total_bytes > 104857600 \
  | eval severity="critical", total_mb=round(total_bytes/1048576,2) \
  | sort -total_bytes
dispatch.earliest_time = -1h
dispatch.latest_time   = now
cron_schedule          = */10 * * * *
alert_type             = always
alert.severity         = 5
actions                = email, webhook
action.email.to        = security@company.com
action.email.subject   = [SOC CRITICAL] Data Exfiltration Detected – $result.src_ip$
action.webhook.url     = https://hooks.slack.com/services/REPLACE/YOUR/WEBHOOK
enableSched            = 1
disabled               = 0

# ─── Malware Detection ───────────────────────────────────────────────────────
[Malware Detection]
search = index=security EventID=4688 \
  process_name IN ("mimikatz.exe","meterpreter.exe","cobalt_strike.exe", \
  "empire.exe","metasploit.exe","ncat.exe","nc.exe","pwdump.exe","fgdump.exe","wce.exe") \
  | table _time, host, user, process_name, cmdline \
  | sort -_time
dispatch.earliest_time = -5m
dispatch.latest_time   = now
cron_schedule          = */2 * * * *
alert_type             = always
alert.severity         = 5
actions                = email, webhook
action.email.to        = security@company.com
action.email.subject   = [SOC CRITICAL] Malware Detected – $result.process_name$ on $result.host$
action.webhook.url     = https://hooks.slack.com/services/REPLACE/YOUR/WEBHOOK
enableSched            = 1
disabled               = 0
